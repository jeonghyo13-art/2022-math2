<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 개정 수학과 교육과정 빈칸 채우기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            word-break: keep-all;
        }
        
        .blank-input {
            border: 2px solid #93c5fd; /* blue-300 */
            border-radius: 0.375rem;
            padding: 0.1rem 0.5rem;
            text-align: center;
            font-weight: bold;
            color: #1d4ed8; /* blue-700 */
            background-color: #eff6ff; /* blue-50 */
            transition: all 0.2s ease;
            outline: none;
            margin: 0.2rem 0.2rem;
            max-width: 100%;
        }
        
        .blank-input:focus {
            border-color: #2563eb; /* blue-600 */
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
            background-color: #fff;
        }

        .blank-input.correct {
            border-color: #22c55e; /* green-500 */
            color: #15803d; /* green-700 */
            background-color: #f0fdf4; /* green-50 */
        }

        .blank-input.wrong {
            border-color: #ef4444; /* red-500 */
            color: #b91c1c; /* red-700 */
            background-color: #fef2f2; /* red-50 */
        }

        .part-tab {
            transition: all 0.2s;
        }
        .part-tab.active {
            color: #4f46e5; /* indigo-600 */
            border-bottom-color: #4f46e5;
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-5xl mx-auto my-4 md:my-8 bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- 헤더 영역 -->
        <header class="bg-indigo-600 p-6 md:p-8 text-white text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">2022 개정 수학과 교육과정 빈칸 채우기</h1>
            <p class="text-indigo-100 text-sm md:text-base">제시된 설명글을 읽고 알맞은 단어를 빈칸에 입력해보세요. (Tab키 또는 Enter키로 다음 칸 이동)</p>
        </header>

        <!-- 본문 영역 -->
        <section class="p-4 sm:p-6 md:p-8">
            <!-- 파트 선택 탭 UI -->
            <div class="flex flex-wrap justify-center gap-2 mb-6 md:mb-8 border-b-2 border-gray-100 pb-2">
                <button onclick="changePart('목표')" class="part-tab active px-3 sm:px-4 py-2 font-bold text-gray-500 border-b-4 border-transparent hover:text-indigo-600 hover:border-indigo-600 text-sm sm:text-base" data-part="목표">수학과 목표</button>
                <button onclick="changePart('학습방향')" class="part-tab px-3 sm:px-4 py-2 font-bold text-gray-500 border-b-4 border-transparent hover:text-indigo-600 hover:border-indigo-600 text-sm sm:text-base" data-part="학습방향">교수·학습 방향</button>
                <button onclick="changePart('학습방법')" class="part-tab px-3 sm:px-4 py-2 font-bold text-gray-500 border-b-4 border-transparent hover:text-indigo-600 hover:border-indigo-600 text-sm sm:text-base" data-part="학습방법">교수·학습 방법</button>
                <button onclick="changePart('평가방향')" class="part-tab px-3 sm:px-4 py-2 font-bold text-gray-500 border-b-4 border-transparent hover:text-indigo-600 hover:border-indigo-600 text-sm sm:text-base" data-part="평가방향">평가 방향</button>
                <button onclick="changePart('평가방법')" class="part-tab px-3 sm:px-4 py-2 font-bold text-gray-500 border-b-4 border-transparent hover:text-indigo-600 hover:border-indigo-600 text-sm sm:text-base" data-part="평가방법">평가 방법</button>
            </div>

            <!-- 난이도 선택 UI -->
            <div class="flex flex-wrap justify-center items-center gap-2 sm:gap-3 md:gap-4 mb-6 md:mb-8 bg-gray-50 p-4 rounded-xl shadow-inner">
                <span class="font-bold text-gray-700 w-full sm:w-auto text-center">난이도 선택:</span>
                <label class="cursor-pointer">
                    <input type="radio" name="difficulty" value="0.3" class="peer sr-only" onchange="changeDifficulty(0.3)">
                    <div class="px-3 sm:px-5 py-2 rounded-full border-2 border-gray-200 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 hover:bg-gray-200 font-medium transition-all text-xs sm:text-sm md:text-base">하 (핵심 30%)</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="difficulty" value="0.5" class="peer sr-only" onchange="changeDifficulty(0.5)" checked>
                    <div class="px-3 sm:px-5 py-2 rounded-full border-2 border-gray-200 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 hover:bg-gray-200 font-medium transition-all text-xs sm:text-sm md:text-base">중 (핵심 50%)</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="difficulty" value="0.9" class="peer sr-only" onchange="changeDifficulty(0.9)">
                    <div class="px-3 sm:px-5 py-2 rounded-full border-2 border-gray-200 peer-checked:bg-indigo-600 peer-checked:text-white peer-checked:border-indigo-600 hover:bg-gray-200 font-medium transition-all text-xs sm:text-sm md:text-base">상 (핵심 90%)</div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="difficulty" value="extreme" class="peer sr-only" onchange="changeDifficulty('extreme')">
                    <div class="px-3 sm:px-5 py-2 rounded-full border-2 border-red-200 text-red-700 peer-checked:bg-red-600 peer-checked:text-white peer-checked:border-red-600 hover:bg-red-50 font-bold transition-all text-xs sm:text-sm md:text-base">최상 (전체 원문)</div>
                </label>
            </div>

            <!-- 동적으로 생성될 퀴즈 컨테이너 -->
            <div id="quiz-container" class="space-y-4 md:space-y-6 text-base md:text-lg leading-loose text-gray-700">
                <!-- Javascript로 내용이 채워집니다. -->
            </div>

            <!-- 하단 버튼 및 결과 메시지 -->
            <div class="mt-10 flex flex-col items-center border-t-2 border-gray-100 pt-8">
                <div id="result-message" class="text-lg md:text-xl font-bold text-indigo-700 min-h-[2rem] mb-6 text-center"></div>
                
                <div class="flex flex-wrap justify-center gap-4">
                    <button onclick="showAnswers()" class="px-6 sm:px-8 py-3 bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 font-bold rounded-lg shadow-md transition-colors">
                        정답 모두 보기
                    </button>
                    <button onclick="resetQuiz()" class="px-6 sm:px-8 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg shadow-md transition-colors">
                        다시 섞기
                    </button>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 파트별 원본 텍스트 데이터 (빈칸 후보는 [단어] 형태로 작성)
        const textData = {
            "목표": [
                "수학의 [개념], [원리], [법칙]을 [이해하고] 수학의 [가치]를 [인식하며] 바람직한 수학적 [태도]를 길러 수학적으로 [추론하고] [의사소통하며] 다양한 현상과 [연결하여] [정보]를 처리하고 문제를 [창의적으로] 해결하는 수학 교과 [역량]을 함양한다.",
                "(1) 수학적 [지식]을 이해하고 [활용하여] [적극적이고] [자신감] 있게 여러 가지 문제를 해결한다.",
                "(2) 수학적 [사실]에 대해 [흥미]와 [관심]을 갖고 [추측]과 [정당화]를 통해 [추론한다].",
                "(3) 수학적 [사고]와 [전략]에 대해 [의사소통하고] 수학적 표현의 [편리함]을 인식한다.",
                "(4) 수학의 [개념], [원리], [법칙] 간의 [관련성]을 탐구하고 실생활이나 타 교과에 수학을 [적용하여] 수학의 [유용성]을 인식한다.",
                "(5) 목적에 맞게 [교구]나 [공학 도구]를 활용하여 자료를 [수집하고] 처리하여 정보에 근거한 [합리적] 의사 결정을 한다."
            ],
            "학습방향": [
                "(1) 교수·학습의 방향",
                "(가) 수학과 교육과정에 제시된 [성격], [목표], [내용 체계], [성취기준], [평가]와 [일관성]을 가지도록 교수·학습을 운영한다.",
                "(나) [핵심 아이디어]를 중심으로 수학의 [지식·이해], [과정·기능], [가치·태도]를 [통합적으로] 교수·학습하여 수학 교과 [역량]을 함양하고 [수리 소양]을 갖추게 한다.",
                "(다) 학생이 [주도적으로] 수학을 학습하여 수학과 교육과정에 제시된 [목표]를 달성하도록 교수·학습을 운영한다.",
                "(라) 수학 [내용 특성]에 적합한 [교구]나 [공학 도구]를 선택하여 [효율적인] 교수·학습이 이루어지도록 하고 학생들의 [디지털 소양] 함양을 도모한다. 그리고 수학 교과서 [읽기], 수학 학습 과정과 결과 [쓰기], [문장제 해결] 등을 통해 학생들의 [언어 소양] 함양을 도모한다.",
                "(마) 수학 내용의 [특성], 학교 [여건], 학생의 [학습 능력]과 [수준] 등을 고려하여 교수·학습을 운영한다.",
                "(바) 학생 개인의 [필요], 수학 [학습 속도], [학습 능력] 등을 고려하여 [학생 맞춤형] 수업을 실시하고 [보충 학습]과 [심화 학습]의 기회를 제공한다.",
                "(사) 수학 교수·학습에서 [범교과 학습 주제](안전·건강, 인성, 진로, 민주 시민, 인권, 다문화, 통일, 독도, 경제·금융, 환경·지속가능발전 등)를 현상이나 소재로 선택하여 [활용할] 수 있다.",
                "(아) 사회적 [환경], 학생의 [요구], 수학 내용의 [특성], 수업 [방식] 등에 따라 [온라인]을 활용한 교수·학습을 운영할 수 있다.",
                "(자) [학교급 전환]에 따라 변화되는 수학 내용과 수업 방법을 파악하여 교수·학습에 적용하고, [진로연계교육]에서 이를 고려한다.",
                "(차) 수학과 교수·학습 계획을 [수립하거나] 교수·학습 자료 [개발] 등을 할 때 교육과정을 [재구성할] 수 있다."
            ],
            "학습방법": [
                "(2) 교수·학습 방법",
                "(가) 수학 교과 [역량 함양]을 통해 수학을 깊이 있게 학습하고 [적용할 기회]를 제공한다.",
                "① 다음과 같은 교수·학습 방법을 통해 [문제해결] 역량을 함양하게 한다.",
                "㉠ 수학의 [개념], [원리], [법칙]을 이용하여 해결 가능한 [문제]를 학생에게 제시한다. 이때 [다양한 방법]으로 해결 가능한 문제, [여러 가지 해답]이 나올 수 있는 문제 등을 활용할 수 있다.",
                "㉡ 문제에 주어진 [조건]과 [정보]를 분석하고 적절한 [문제해결 계획]을 수립하고 실행하며 문제해결 과정을 [반성하도록] 구체적인 [발문]과 [권고]를 제시한다.",
                "㉢ 문제해결 과정 및 결과의 [의미]를 [재해석하여] 주어진 문제를 [변형하거나] 새로운 문제를 [만들어] 해결하게 한다.",
                "㉣ [성공적인] 문제해결 경험을 바탕으로 [적극적이고] [자신감] 있게 문제해결에 참여하게 하고, 단번에 답이 나오지 않는 문제라도 [끈기 있게] 도전하여 [성취감]을 느끼게 한다.",
                "② 다음과 같은 교수·학습 방법을 통해 [추론] 역량을 함양하게 한다.",
                "㉠ [관찰], [실험], [측정] 등 [구체적 조작 활동]을 통해 수학의 개념, 원리, 법칙에 흥미와 관심을 갖고 [다양한 방법]으로 [탐구하고] [이해하게] 한다.",
                "㉡ [귀납], [유추] 등의 [개연적 추론]을 통해 수학적 [추측]을 제기하고 [정당화하며], 수학적 [증거]와 [논리적 근거]를 바탕으로 [비판적으로] 사고하는 태도를 갖게 한다.",
                "㉢ 수학의 개념, 원리, 법칙을 [도출하는 과정]과 수학적 [절차]를 [논리적이고] [체계적으로] 수행하고 [반성하게] 한다.",
                "③ 다음과 같은 교수·학습 방법을 통해 [의사소통] 역량을 함양하게 한다.",
                "㉠ 수학 [용어], [기호], [표], [그래프] 등의 수학적 [표현]을 [정확하게] 사용하고 표현끼리 [변환하게] 한다.",
                "㉡ 학생이 자신의 [사고]와 [전략]을 수학적 [표현]으로 나타내고 [설명하면서] 수학적 표현의 [편리함]을 인식하게 한다.",
                "㉢ 학생 간 [상호 작용]과 [질문]이 활발한 교실 문화를 조성하고 수학적으로 의미 있는 [의사소통]이 이루어지도록 적절한 [과제]를 제시하고 안내한다.",
                "㉣ 수학적 [아이디어]에 대해 상호 작용하는 과정에서 [타인]을 [배려하고] 의견을 [존중하는] 태도를 기르게 한다.",
                "④ 다음과 같은 교수·학습 방법을 통해 [연결] 역량을 함양하게 한다.",
                "㉠ [영역]이나 [학년(군)] 내용 간에 관련된 수학의 개념, 원리, 법칙 등을 [유기적으로 연계하여] 새로운 지식을 생성하면서 [창의성]을 기르게 한다.",
                "㉡ 수학과 [실생활], 사회 및 자연 현상, [타 교과]의 내용을 [연계하는] 과제를 활용하여 수학의 [유용성]을 인식하게 한다.",
                "⑤ 다음과 같은 교수·학습 방법을 통해 [정보처리] 역량을 함양하게 한다.",
                "㉠ [실생활] 및 [수학적 문제 상황]에서 자료를 [탐색하고] [수집하며] 수학적으로 [처리하여] [합리적인] 의사 결정을 하는 태도를 기르게 한다.",
                "㉡ [교구]나 [공학 도구]를 활용하여 [추상적인] 수학 내용을 [시각화하고] 수학의 개념, 원리, 법칙에 대한 [직관적 이해]와 [논리적 사고]를 돕는다.",
                "㉢ 학생이 [주도적으로] 교구나 공학 도구를 활용하여 [탐구하게] 한다.",
                "㉣ [계산 기능 함양]을 목표로 하지 않는 교수·학습 상황에서는 복잡한 계산을 할 때 [공학 도구]를 이용할 수 있게 한다.",
                "(나) 학생들이 수학 학습에 [주도적으로] 참여하는 교수·학습 [환경]과 [분위기]를 조성한다.",
                "① 수학 학습의 주체가 [학생 자신임]을 인식하고 수학 학습에 [적극적으로] 참여하도록 유도한다.",
                "② [스스로] 수학 학습 목표와 계획을 세우고 학습 결과를 [평가하고] [성찰하도록] 안내한다.",
                "③ 수학을 [효과적으로] 학습하는 방법을 [탐색하고] 자신의 학습 과정과 태도를 돌아보고 조절하는 [자기주도적] 학습 습관을 형성하도록 지도한다.",
                "④ 교사 및 동료와 [협력적 관계] 속에서 수학 학습에 대한 조언과 의견을 [경청하고] [수용할] 수 있도록 [허용적인] 분위기를 조성한다.",
                "⑤ 수학 학습에 [자신감]을 가지고 실수가 [배움의 기회]임을 인식하며 [끈기 있게] 도전하도록 격려하고 지원한다.",

                if (tab.dataset.part === currentPart) {
                    tab.classList.add('active', 'text-indigo-600', 'border-indigo-600');
                    tab.classList.remove('text-gray-500', 'border-transparent');
                } else {
                    tab.classList.remove('active', 'text-indigo-600', 'border-indigo-600');
                    tab.classList.add('text-gray-500', 'border-transparent');
                }
            });
        }

        // 난이도 변경
        function changeDifficulty(ratio) {
            currentDifficulty = ratio;
            renderQuiz();
        }

        // 최상(전체 원문) 난이도에서 빈칸으로 만들지 않을 짧은 조사·형식 형태소 목록
        const excludedParticles = new Set([
            '을', '를', '이', '가', '은', '는', '와', '과', '의', '에', '로', '으로',
            '도', '만', '에서', '에게', '께', '부터', '까지', '등', '등을', '등의',
            '등과', '간의', '및', '또는', '때', '수', '데', '것', '바', '군'
        ]);

        // 일반 텍스트 구간을 어절 단위 빈칸 후보로 세분화 (최상 난이도용)
        function expandPlainTextToBlanks(text, isStartOfSentence, allBlanks) {
            const result = [];
            let remaining = text;

            // 문장 맨 앞의 번호/기호(예: (1), (가), ①, ㉠)는 빈칸에서 제외하고 유지
            if (isStartOfSentence) {
                const bulletMatch = remaining.match(/^(\s*(?:\([가-힣0-9]+\)|[①-⑳㉠-㉿])\s*)/);
                if (bulletMatch) {
                    result.push({ type: 'text', content: bulletMatch[1] });
                    remaining = remaining.slice(bulletMatch[1].length);
                }
            }

            const wordRegex = /([가-힣a-zA-Z0-9·]+)/g;
            let match;
            let lastIdx = 0;

            while ((match = wordRegex.exec(remaining)) !== null) {
                if (match.index > lastIdx) {
                    result.push({ type: 'text', content: remaining.substring(lastIdx, match.index) });
                }

                const word = match[1];
                if (excludedParticles.has(word)) {
                    result.push({ type: 'text', content: word });
                } else {
                    const blankObj = { type: 'candidate', word: word, isBlank: false };
                    result.push(blankObj);
                    allBlanks.push(blankObj);
                }
                lastIdx = wordRegex.lastIndex;
            }

            if (lastIdx < remaining.length) {
                result.push({ type: 'text', content: remaining.substring(lastIdx) });
            }

            return result;
        }

        // 퀴즈 화면 렌더링
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            resultMessage.textContent = '';
            
            const currentData = textData[currentPart];
            const isExtreme = currentDifficulty === 'extreme';
            let allBlanks = [];
            let currentSubSection = '';

            // 1. 모든 문장의 빈칸 후보를 파싱하여 배열에 담기
            const parsedSentences = currentData.map(sentence => {
                const subSectionMatch = sentence.match(/^\s*\(([가-힣])\)/);
                if (subSectionMatch) {
                    currentSubSection = subSectionMatch[1];
                }

                // 교수·학습 방법 및 평가 방법 파트의 (가), (나), ... 항목과
                // 교수·학습 방법의 (가) 하위 ①~⑤ 안내 문장은 빈칸을 만들지 않고 원문 그대로 표시
                const isExemptSubItem =
                    ((currentPart === '학습방법' || currentPart === '평가방법') && Boolean(subSectionMatch)) ||
                    (currentPart === '학습방법' && currentSubSection === '가' && /^\s*[①-⑤]/.test(sentence));

                if (isExemptSubItem) {
                    const cleanText = sentence.replace(/\[([^\]]+)\]/g, '$1');
                    return { isHeading: false, isSubHeading: true, parts: [{ type: 'text', content: cleanText }] };
                }

                const hasBrackets = /\[([^\]]+)\]/.test(sentence);
                // 소제목 줄(대괄호가 없는 항목 제목)은 그대로 제목으로 표시
                if (!hasBrackets) {
                    return { isHeading: true, isSubHeading: false, parts: [{ type: 'text', content: sentence }] };
                }

                const parts = [];
                const regex = /\[([^\]]+)\]/g;
                let match;
                let lastIndex = 0;

                while ((match = regex.exec(sentence)) !== null) {
                    if (match.index > lastIndex) {
                        const plainSegment = sentence.substring(lastIndex, match.index);
                        if (isExtreme) {
                            parts.push(...expandPlainTextToBlanks(plainSegment, lastIndex === 0, allBlanks));
                        } else {
                            parts.push({ type: 'text', content: plainSegment });
                        }
                    }

                    const blankObj = { type: 'candidate', word: match[1], isBlank: false };
                    parts.push(blankObj);
                    allBlanks.push(blankObj);
                    lastIndex = regex.lastIndex;
                }

                if (lastIndex < sentence.length) {
                    const tailSegment = sentence.substring(lastIndex);
                    if (isExtreme) {
                        parts.push(...expandPlainTextToBlanks(tailSegment, lastIndex === 0, allBlanks));
                    } else {
                        parts.push({ type: 'text', content: tailSegment });
                    }
                }

                return { isHeading: false, isSubHeading: false, parts };
            });

            // 2. 난이도 비율에 맞게 무작위로 빈칸 활성화
            if (isExtreme) {
                allBlanks.forEach(item => {
                    item.isBlank = true;
                });
            } else if (allBlanks.length > 0) {
                const targetBlankCount = Math.max(1, Math.round(allBlanks.length * currentDifficulty));
                const shuffledIndices = Array.from({ length: allBlanks.length }, (_, i) => i)
                    .sort(() => Math.random() - 0.5);
                for (let i = 0; i < targetBlankCount; i++) {
                    allBlanks[shuffledIndices[i]].isBlank = true;
                }
            }

            // 3. DOM 요소 생성 및 이벤트 바인딩
            let blankCounter = 0;
            parsedSentences.forEach(item => {
                const p = document.createElement('p');

                if (item.isHeading) {
                    p.className = "font-bold text-indigo-800 text-lg md:text-xl bg-indigo-50 px-4 py-2.5 rounded-lg border-l-4 border-indigo-600 mt-4";
                    p.textContent = item.parts[0].content;
                    container.appendChild(p);
                    return;
                }

                if (item.isSubHeading) {
                    p.className = "font-bold text-gray-800 bg-gray-100 px-4 py-3 rounded-lg border border-gray-200 shadow-sm";
                    p.textContent = item.parts[0].content;
                    container.appendChild(p);
                    return;
                }

                p.className = "bg-gray-50/70 p-4 rounded-xl border border-gray-100 leading-relaxed";

                item.parts.forEach(part => {
                    if (part.type === 'text') {
                        p.appendChild(document.createTextNode(part.content));
                    } else if (part.type === 'candidate') {
                        if (part.isBlank) {
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'blank-input';
                            input.dataset.answer = part.word;
                            input.dataset.index = blankCounter++;
                            input.autocomplete = 'off';
                            input.spellcheck = false;

                            // 글자 길이에 맞춘 적절한 너비 설정
                            const charLen = Math.max(part.word.length, 2);
                            input.style.width = `${charLen * 1.15 + 1.4}rem`;

                            // 실시간 입력 확인: 정답 일치 즉시 초록색 처리
                            input.addEventListener('input', () => {
                                const userVal = input.value.trim();
                                const answer = input.dataset.answer.trim();
                                if (userVal === answer) {
                                    input.classList.add('correct');
                                    input.classList.remove('wrong');
                                } else {
                                    input.classList.remove('correct', 'wrong');
                                }
                                updateProgress();
                            });

                            // 칸을 벗어날 때(blur) 미완성 또는 오답이면 빨간색 표시 후 정답 자동 채우기
                            input.addEventListener('blur', () => {
                                const userVal = input.value.trim();
                                const answer = input.dataset.answer.trim();
                                if (userVal !== answer) {
                                    input.value = answer;
                                    input.classList.add('wrong');
                                    input.classList.remove('correct');
                                    updateProgress();
                                }
                            });

                            // 다시 클릭/포커스 시 텍스트 전체 선택하여 재시도 편의 제공
                            input.addEventListener('focus', () => {
                                input.select();
                            });

                            // Tab 및 Enter 키로 다음 빈칸 이동
                            input.addEventListener('keydown', (e) => {
                                if (e.key === 'Tab' || e.key === 'Enter') {
                                    const inputs = Array.from(document.querySelectorAll('.blank-input'));
                                    const currentIdx = inputs.indexOf(input);
                                    if (e.shiftKey && e.key === 'Tab') {
                                        if (currentIdx > 0) {
                                            e.preventDefault();
                                            inputs[currentIdx - 1].focus();
                                        }
                                    } else {
                                        e.preventDefault();
                                        if (currentIdx < inputs.length - 1) {
                                            inputs[currentIdx + 1].focus();
                                        } else {
                                            input.blur();
                                        }
                                    }
                                }
                            });

                            p.appendChild(input);
                        } else {
                            p.appendChild(document.createTextNode(part.word));
                        }
                    }
                });

                container.appendChild(p);
            });

            updateProgress();
        }

        // 실시간 진행률 업데이트
        function updateProgress() {
            const inputs = Array.from(document.querySelectorAll('.blank-input'));
            const total = inputs.length;
            if (total === 0) {
                resultMessage.textContent = '';
                return;
            }
            const correctCount = inputs.filter(inp => inp.classList.contains('correct')).length;
            const percent = Math.round((correctCount / total) * 100);

            if (correctCount === total) {
                resultMessage.textContent = `🎉 완벽합니다! 모든 빈칸(${total}개)을 100% 맞혔습니다!`;
            } else {
                resultMessage.textContent = `진행 현황: ${correctCount} / ${total}개 완료 (${percent}%)`;
            }
        }

        // 정답 모두 보기
        function showAnswers() {
            const inputs = document.querySelectorAll('.blank-input');
            inputs.forEach(input => {
                const answer = input.dataset.answer.trim();
                if (!input.classList.contains('correct')) {
                    input.value = answer;
                    input.classList.add('wrong');
                    input.classList.remove('correct');
                }
            });
            updateProgress();
        }

        // 다시 섞기
        function resetQuiz() {
            renderQuiz();
        }
    </script>
</body>
</html>
